name: emotiva_remote
description: A remote control for Emotiva processors.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.7.0+2025081701

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  xml: ^6.3.0
  provider: ^6.1.1
  logging: ^1.2.0
  google_fonts: ^6.1.0
  shared_preferences: ^2.5.1
  flutter_android_volume_keydown: ^1.0.0
  logging_flutter: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.25.8

flutter:
  uses-material-design: true
  assets:
    - assets/
    - google_fonts/
