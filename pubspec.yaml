name: emotiva_remote
description: A remote control for Emotiva processors.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.9.8+2026110101

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  xml: ^7.0.1
  provider: ^6.1.1
  logging: ^1.2.0
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.1
  flutter_android_volume_keydown: ^1.0.0
  logging_flutter: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.25.8

flutter:
  uses-material-design: true
  assets:
    - assets/
    - google_fonts/
