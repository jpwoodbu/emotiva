name: emotiva_remote
description: A remote control for Emotiva processors.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.9.1+2026032801

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  xml: ^7.0.1
  provider: ^6.1.1
  logging: ^1.2.0
  google_fonts: ^8.0.2
  shared_preferences: ^2.5.1
  flutter_android_volume_keydown: ^1.0.0
  logging_flutter: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.25.8

dependency_overrides:
  # Version 2.6.0 is available, but introduces some Mac deps, even for Linux
  # builds, which break the Linux build. 2.5.1 is a known working version which
  # still satisfies the dependency spec of its parent in the deps tree.
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - google_fonts/
